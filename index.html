<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цифровой технадзор — Практикум (ДЕМО)</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; frame-src blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">

<style>
:root{
  --bg:#f0f2f7; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e5e9f0;
  --accent:#2563eb; --accent-soft:#e8f0fe;
  --ok:#16a34a; --ok-soft:#e7f6ec;
  --warn:#d97706; --warn-soft:#fdf3e3;
  --bad:#dc2626; --bad-soft:#fdeaea;
  --dark:#0f1729; --r:16px; --r-sm:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.app{display:flex;flex-direction:column;height:100dvh;max-width:480px;width:100%;min-width:0;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;border-radius:32px;box-shadow:0 40px 100px rgba(0,0,0,.5)}
@media (max-width:540px){body{padding:0}.app{border-radius:0;box-shadow:none}}

/* APP BAR */
.appbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;background:var(--dark);color:#fff;min-height:56px;z-index:20}
.appbar .ab-btn{background:rgba(255,255,255,.08);border:none;color:#fff;width:36px;height:36px;border-radius:11px;flex:0 0 36px;display:grid;place-items:center;font-size:18px;cursor:pointer}
.appbar h1{margin:0;font-size:16px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ab-tag{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:rgba(59,130,246,.2);color:#93c5fd}

/* SCREEN */
.screen{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:16px;padding-bottom:calc(86px + env(safe-area-inset-bottom))}

/* TAB BAR */
.tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(15,23,42,.04);z-index:20}
.tabbar button{background:none;border:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#94a3b8;cursor:pointer;position:relative;font-family:inherit}
.tabbar button.active{color:var(--accent)}
.tabbar button.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:2.5px;background:var(--accent);border-radius:0 0 3px 3px}
.tabbar svg{width:22px;height:22px}

/* CARDS & LISTS */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;min-width:0}
.journal-row > span{min-width:0;overflow-wrap:anywhere}
.card.disabled{opacity:.55}
.card-h{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--line);background:#f8fafc}
.card-h h2{margin:0;font-size:13px;font-weight:700;color:#334155;text-transform:uppercase;letter-spacing:.05em;flex:1}
.card-b{padding:14px 15px}
.li{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid #f1f5f9;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;font-family:inherit;color:inherit}
.li:last-child{border-bottom:none}
.li:active{background:#f1f5f9}
.li .li-ico{width:36px;height:36px;border-radius:10px;flex:0 0 36px;display:grid;place-items:center;font-size:14px;font-weight:700;background:#eef2f7;color:#475569}
.li .li-ico.ok{background:var(--ok-soft);color:#15803d}
.li .li-ico.acc{background:var(--accent-soft);color:#1d4ed8}
.li .li-ico.warn{background:var(--warn-soft);color:#b45309}
.li .li-ico.disabled{background:#e2e8f0;color:#94a3b8}
.li .li-ico.bad{background:var(--bad-soft);color:var(--bad)}

/* ПЕЧАТЬ ОТЧЁТОВ */
@media print{
  body{background:#fff;padding:0;display:block}
  .app{height:auto;max-width:none;border-radius:0;box-shadow:none;overflow:visible}
  .appbar,.tabbar,.no-print,label.btn{display:none!important}
  .screen{overflow:visible;padding:0}
  .card{break-inside:avoid}
}
.li .li-body{flex:1;min-width:0}
.li .li-t{font-size:13.5px;font-weight:600;line-height:1.3}
.li .li-s{font-size:11.5px;color:var(--muted);margin-top:2px}
.li.disabled{opacity:0.5;pointer-events:none;cursor:not-allowed}

/* МЕТКИ */
.tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:#eef2f7;color:#64748b;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 16px;font-size:13.5px;font-weight:600;cursor:pointer;min-height:44px;width:100%;margin-top:10px;color:var(--ink);transition:.15s}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.success{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn:disabled{background:#e2e8f0;border-color:#cbd5e1;color:#94a3b8;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.98)}

/* ФОРМЫ */
.check-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px;background:#f8fafc}
.check-item input[type="checkbox"]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
.check-item label{font-size:13px;font-weight:500;cursor:pointer;flex:1;margin:0}

/* ЖУРНАЛЫ */
.journal-row{font-size:12.5px;padding:6px 0;border-bottom:1px dashed #e2e8f0;display:flex;justify-content:space-between;gap:10px}
.journal-row:last-child{border-bottom:none}
.journal-row .j-time{color:var(--muted);font-family:monospace;font-size:11px;flex:0 0 auto}

/* БЛОК ОБЪЕМОВ */
.volume-block{background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;padding:10px 12px;margin-bottom:10px}
.volume-block .v-title{font-weight:700;color:#475569;font-size:10.5px;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between}
.volume-block .v-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.volume-block .v-row .v-k{color:var(--muted)}
.volume-block .v-row .v-v{font-weight:600;color:var(--ink)}
.volume-block .v-progress{height:4px;background:#e2e8f0;border-radius:20px;margin-top:6px;overflow:hidden}
.volume-block .v-progress > div{height:100%;background:var(--ok);border-radius:20px}

/* СВЯЗЬ ЖУРНАЛ-ТК */
.tk-link{background:var(--accent-soft);color:var(--accent);font-size:11px;padding:8px 12px;border-radius:8px;margin-bottom:10px;display:flex;align-items:center;gap:6px;font-weight:600}

/* НОРМАТИВНЫЕ БЛОКИ */
.norm-block{background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:11.5px;line-height:1.5}
.norm-block .n-title{font-weight:700;color:#475569;margin-bottom:4px;text-transform:uppercase;font-size:10.5px}
.norm-block .n-text{color:#334155}
.norm-block .n-text b{color:var(--accent)}

/* АОСР */
.doc-header{text-align:center;border-bottom:2px solid #1e293b;padding-bottom:10px;margin-bottom:14px}
.doc-header h2{margin:0 0 4px;font-size:15px;font-weight:800;text-transform:uppercase}
.sig-item{display:flex;flex-direction:column;gap:2px;font-size:12px;padding:6px 0;border-bottom:1px dotted #e2e8f0}
.sig-status{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px}
.sig-status.done{background:var(--ok-soft);color:var(--ok)}
.sig-status.pending{background:var(--warn-soft);color:var(--warn)}
.sig-status.blocked{background:#eef2f7;color:#94a3b8}

/* СХЕМА ВЗАИМОДЕЙСТВИЙ */
.flow-step{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px dashed #e2e8f0}
.flow-step:last-child{border-bottom:none}
.flow-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 24px;margin-top:2px}
.flow-text{flex:1;font-size:13px;font-weight:500;line-height:1.4}
.flow-text b{color:var(--ink)}
.flow-note{font-size:11px;color:var(--muted);margin-top:2px;font-weight:400}

/* МАТЕРИАЛЫ */
.mat-item{background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;padding:12px;margin-bottom:8px}
.mat-header{display:flex;justify-content:space-between;margin-bottom:6px}
.mat-name{font-size:13px;font-weight:600}
.mat-status{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:4px}
.mat-status.ok{background:var(--ok-soft);color:var(--ok)}
.mat-status.warn{background:var(--warn-soft);color:var(--warn)}
.mat-info{font-size:11.5px;color:var(--muted);margin-bottom:8px}

/* ПРЕДУПРЕЖДЕНИЕ */
.warning-block{background:var(--warn-soft);border:1px solid #fde68a;border-radius:8px;padding:12px;margin-bottom:12px;font-size:12px;color:#92400e;line-height:1.5}
.warning-block b{color:#b45309}

/* ПРАКТИКУМ: пометка ДЕМО на каждом экране и при печати */
.pr-demo-mark{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;color:#b45309;background:#fdf3e3;border:1px dashed #d97706;border-radius:6px;padding:2px 8px;margin-bottom:6px}
.screen::before{content:'ДЕМО · учебная версия «Практикум» · данные условные';display:block;text-align:center;font-size:11px;font-weight:700;color:#b45309;background:#fdf3e3;border:1px dashed #d97706;border-radius:8px;padding:4px 6px;margin-bottom:10px}
@media print{.screen::before{border:1px solid #b45309}.screen::after{content:'ДЕМО';position:fixed;top:35%;left:12%;font-size:140px;font-weight:900;color:rgba(220,38,38,.10);transform:rotate(-30deg);pointer-events:none}}
</style>
</head>

<div class="app">

};

// Прикреплённые файлы: в памяти (FILES — ссылки для просмотра) + IndexedDB браузера (переживают перезагрузку)
// + метаданные в STATE.fileMeta (что было приложено и когда). В рабочей версии — хранилище на сервере.
const FILES = {};
const IDB = { db: null };
function idbOpen() {
  return new Promise(res => {
    try { const r = indexedDB.open('tehnadzor_files', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('f');
      r.onsuccess = () => { IDB.db = r.result; res(true); };
      r.onerror = () => res(false);
    } catch (e) { res(false); }
  });
}
function idbPut(key, blob) { try { if (IDB.db) IDB.db.transaction('f', 'readwrite').objectStore('f').put(blob, key); } catch (e) {} }
function idbAll() {
  return new Promise(res => {
    if (!IDB.db) return res([]);
    const out = [];
    try { const rq = IDB.db.transaction('f').objectStore('f').openCursor();
      rq.onsuccess = () => { const c = rq.result; if (c) { out.push([c.key, c.value]); c.continue(); } else res(out); };
      rq.onerror = () => res(out);
    } catch (e) { res(out); }
  });
}
function persistFile(key, file) {
  STATE.fileMeta = STATE.fileMeta || {};
  STATE.fileMeta[key] = { name: file.name, type: file.type, date: today() };
  idbPut(key, file);
}
function hasFile(key) { return !!FILES[key] || !!(STATE.fileMeta || {})[key]; }
// файл приложен, но в этом браузере недоступен (другое устройство / очищено хранилище)
function fileLost(key) { return !FILES[key] && !!(STATE.fileMeta || {})[key]; }
async function restoreFiles() {
  if (!(await idbOpen())) return;
  const all = await idbAll();
  all.forEach(([k, blob]) => {
    const meta = (STATE.fileMeta || {})[k] || {};
    const f = { name: meta.name || blob.name || String(k), type: meta.type || blob.type || '', url: URL.createObjectURL(blob) };
    const m = String(k).match(/^(.*)#\d+$/);
    if (m) (FILES[m[1]] = FILES[m[1]] || []).push(f); else FILES[k] = f;
  });
  if (all.length) render();
}

function attachFile(id, input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (FILES[id]) URL.revokeObjectURL(FILES[id].url);
  FILES[id] = { name: file.name, type: file.type, url: URL.createObjectURL(file) };
  persistFile(id, file);
  STATE.docRev = STATE.docRev || {};
  const rev = STATE.docRev[id] = (STATE.docRev[id] || 0) + 1;
  addToJournal('obshiy', `Прикреплён файл к «${DOCS[id].title}»: ${file.name}${rev > 1 ? ` (ревизия ${rev - 1})` : ''}`);
  // Новая ревизия (не первичная загрузка) разделов, определяющих нулевой цикл (КЖ, КМ) →
  // ТК по ещё не принятым работам подлежат пересмотру — каждая отдельно
  if (rev > 1 && ['kzh', 'km'].includes(id)) {
    const tks = TK_STEPS.map(s => s[0]).filter(c => !STATE[TK_MAP[c].flag]);
    if (tks.length) {
      STATE.tkReview = { by: `${DOCS[id].code}, ревизия ${rev - 1}`, date: today(), tks };
      addToJournal('obshiy', `Новая ревизия ${DOCS[id].code} — на пересмотр ТК: ${tks.join(', ')}`);
    }
  }
  render();
}

// Проверка ресурсов ТК объекта по нормам типовой карты.
// Машины: часы в сутки — двухсменная работа, СН РК 1.03-00-2022, п. 11.1.12 («исходить из не менее чем двухсменной работы»), смена 8 ч.
// Рабочие: один человек — одна смена 8 ч в сутки; вторая смена — отдельное звено строкой графика (tk_normirovanie.json, discrepancies).
const SHIFT_HOURS = 16;
const SHIFT_LEN = 8;
function resourceCheck(code, t) {
  const c = t.check;
  if (!c) return null;
  const d = tkData(code);
  const op = d.ops[c.op || 0] || {};
  const qty = c.qtyFn ? c.qtyFn() : num(op.qty);
  const unit = c.qtyUnit || op.unit || '';
  const per = c.perUnitFn ? c.perUnitFn() : c.perUnit;
  const need = Math.round(qty * per * 10) / 10;
  const list = c.kind === 'machine' ? d.machines.filter(m => c.res.test(m.name)) : d.workers.filter(w => c.res.test(w.prof));
  const days = r => Math.round((parseRu(r.end || r.start) - parseRu(r.start)) / 86400000) + 1;
  const hrs = c.kind === 'machine' ? SHIFT_HOURS : SHIFT_LEN;
  const have = list.reduce((s, r) => s + num(r.n) * days(r) * hrs, 0);
  return { qty, unit, per, need, have, hrs, ok: list.length > 0 && have >= need, list, days,
    what: c.kind === 'machine' ? 'маш.-ч' : 'чел.-ч', opName: c.qtyFn ? 'весь объём' : (op.name || '') };
}

function proj() { return STATE.project || PROJECT_DEMO; }
function tkData(code) { return (proj().tk || {})[code] || { ops: [], deliveries: [], workers: [], machines: [] }; }
function tkRange(code) {
  const d = tkData(code);
  const dates = d.ops.flatMap(o => [o.start, o.end]).filter(Boolean).map(parseRu);
  if (!dates.length) return null;
  return { start: new Date(Math.min(...dates)), end: new Date(Math.max(...dates)) };
}
function tkComplete(code) {
  const d = tkData(code);
  const hasMats = Object.keys(MATERIALS).some(id => MATERIALS[id].tk === code);
  const missing = [];
  if (!(d.ops || []).length) missing.push('графика производства работ');
  if (hasMats && !(d.deliveries || []).length) missing.push('графика поставки');
  if (!((d.workers || []).length + (d.machines || []).length)) missing.push('графика движения ресурсов');
  return { ok: missing.length === 0, missing };
}
function tkNeedsReview(code) { const r = STATE.tkReview; return !!r && !STATE[TK_MAP[code].flag] && (!r.tks || r.tks.includes(code)); }

// Применить проект: наименования и даты ТК, объёмы поставки материалов
function applyProject() {
  TK_STEPS.forEach(s => {
    const r = tkRange(s[0]);
    if (r) s[2] = fmtRu(r.start);
  });
  Object.keys(MATERIALS).forEach(id => {
    const ds = Object.values(proj().tk || {}).flatMap(t => (t.deliveries || []).filter(x => x.mat === id));
    MATERIALS[id].qty0 = MATERIALS[id].qty0 || MATERIALS[id].qty; // исходное значение — для сброса при смене проекта
    MATERIALS[id].qty = ds.length ? (Math.round(ds.reduce((n, x) => n + Number(x.qty || 0), 0) * 100) / 100) + ' ' + (ds[0].unit || '') : MATERIALS[id].qty0;
  });
}

function importProject(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let p;
    try { p = JSON.parse(rd.result); } catch (e) { alert('Файл не является JSON проекта ППР'); return; }
    if (!p || typeof p.tk !== 'object') { alert('В файле нет раздела «tk» с технологическими картами'); return; }
    const unknown = Object.keys(p.tk).filter(k => !TK_MAP[k]);
    if (unknown.length) { alert('Неизвестные ТК: ' + unknown.join(', ') + '. Допустимы: ' + TK_STEPS.map(s => s[0]).join(', ')); return; }
    Object.values(p.tk).forEach(t => ['ops', 'deliveries', 'workers', 'machines'].forEach(k => { t[k] = Array.isArray(t[k]) ? t[k] : []; }));
    const sameRev = STATE.tkReview && (p.rev || '') === (proj().rev || '');
    if (sameRev) alert('Ревизия проекта ППР не изменилась (' + (p.rev || '—') + ') — ТК остаются на пересмотре. Загрузите пересмотренную ревизию.');
    STATE.project = p;
    if (!sameRev) STATE.tkReview = null;
    applyProject();
    const bad = TK_STEPS.filter(s => !tkComplete(s[0]).ok).map(s => s[0]);
    addToJournal('obshiy', `Загружен проект ППР «${p.name || file.name}», ревизия ${p.rev || '—'}${bad.length ? ' · неполные ТК: ' + bad.join(', ') : ''}`);
    render();
  };
  rd.readAsText(file, 'utf-8');
}
function exportProject() {
  const blob = new Blob([JSON.stringify(proj(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ppr_tk_' + (proj().rev || '0') + '.json';
  a.click();
}
function confirmTkReview(code) {
  const r = STATE.tkReview; if (!r) return;
  r.tks = (r.tks || TK_STEPS.map(s => s[0])).filter(c => c !== code);
  addToJournal('obshiy', `${code} пересмотрена после изменения проекта (${r.by}) — изменения не затрагивают ТК`);
  if (!r.tks.length) STATE.tkReview = null;
  render();
}

function openTk(code) {
  STATE.currentTkCard = code;
  STATE.currentView = 'tk_view';
  render();
}

// Диаграмма Ганта: rows = [{label, sub, start, end, cls}]
function gantt(rows, from, to) {
  const day = 86400000;
  const days = Math.round((to - from) / day) + 1;
  const ticks = Array.from({ length: days }, (_, k) => new Date(from.getTime() + k * day).getDate());
  return `
    <div style="display:flex;font-size:9.5px;color:var(--muted);margin:0 0 4px 0">
      <div style="flex:0 0 38%"></div>
      <div style="flex:1;display:flex">${ticks.map(d => `<div style="flex:1;text-align:center">${d}</div>`).join('')}</div>
    </div>
    ${rows.map(r => {
      const s = parseRu(r.start), e = parseRu(r.end || r.start);
      const left = (s - from) / day / days * 100, width = ((e - s) / day + 1) / days * 100;
      return `
        <div style="display:flex;align-items:center;margin-bottom:5px">
          <div style="flex:0 0 38%;font-size:11px;line-height:1.25;padding-right:6px">${r.label}${r.sub ? `<div style="color:var(--muted);font-size:10px">${r.sub}</div>` : ''}</div>
          <div style="flex:1;position:relative;height:16px;background:repeating-linear-gradient(90deg,#f1f5f9 0,#f1f5f9 1px,transparent 1px,transparent ${100 / days}%);border-radius:3px">
            <div style="position:absolute;left:${left}%;width:${width}%;top:2px;bottom:2px;border-radius:3px;background:${r.cls === 'ok' ? 'var(--ok)' : 'var(--accent)'}"></div>
          </div>
        </div>`;
    }).join('')}`;
}

              ${r.ok ? '' : `<br><b>Не хватает ${Math.round((r.need - r.have) * 10) / 10} ${r.what}</b> — увеличить ресурс или срок в проекте ППР`}

            </details>`).join('')}
          ${code === 'ТК-Сваи' ? '' : ''}
          <div style="font-size:11px;color:var(--muted)">ТК объекта разрабатывается на основе типовой с привязкой к объекту: уточняются объёмы, ресурсы и графики (СН РК 1.03-00-2022, п. 11.2.3 — ТК входят в состав ППР).</div>

          <details style="margin-top:4px"><summary style="cursor:pointer;font-size:12px;font-weight:600">Требования безопасности по ТК (${tb.req.length})</summary>${rq(tb.req)}</details>

        ${gantt(d.workers.map(w => ({ label: w.prof, sub: `${w.n} чел.`, start: w.start, end: w.end })), from, to)}` : ''}
      ${d.machines.length ? `
        <div style="font-size:10.5px;font-weight:700;color:#64748b;text-transform:uppercase;margin:10px 0 4px">Машины и механизмы</div>

    <div class="no-print">
      ${tkNeedsReview(code) ? `<button class="btn warn" onclick="confirmTkReview('${code}')">✓ ${code} пересмотрена — изменения проекта её не затрагивают</button>` : ''}
      <label class="btn primary" style="cursor:pointer">📥 Загрузить проект ППР (ТК, JSON)
        <input type="file" accept=".json,application/json" style="display:none" onchange="importProject(this)"></label>
      <button class="btn" onclick="exportProject()">⬇ Скачать текущий проект (шаблон JSON)</button>

      <button class="btn" onclick="STATE.currentView='ppr_main_view'; render()">Закрыть</button>

  `;
}

// СОХРАНЕНИЕ (демо: в браузере пользователя)
const SAVE_KEY = 'tehnadzor_praktikum_app_v1';
function saveState() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(STATE)); } catch (e) {} }
function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (saved) Object.assign(STATE, saved);
  } catch (e) {}
}
function resetDemo() {
  if (!confirm('Сбросить все демо-данные?')) return;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  location.reload();
}

function today() { return new Date().toLocaleDateString('ru-RU'); }

function nav(tab) {
  STATE.currentTab = tab;
  STATE.currentView = 'main';
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.remove('active'));
  document.getElementById('t-' + tab).classList.add('active');
  render();
}

function goBack() {
  const v = STATE.currentView;
  if (v === 'pr_work_view' || v === 'pr_report_view') { nav('praktikum'); return; }
  if (v === 'aosr_view' || v === 'tk_view') { STATE.currentView = 'ppr_main_view'; render(); }
  else if (v === 'doc_view' || v === 'geo_view') nav('docs');
  else if (v === 'op_view' || v === 'mat_view' || v === 'passport_view') nav('control');
  else if (v === 'actE_view' || v === 'pilemap_view') { STATE.currentView = 'passport_view'; render(); }
  else if (v === 'gask_view' || v === 'decl_view') nav('reports');
  else if (v.startsWith('journal_')) nav('journals');
  else nav('docs');
}

function addToJournal(journal, text) {
  const time = new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
  const date = today();
  if (journal === 'obshiy') { STATE.db_obshiy.unshift({ date, time, text }); return; }
  STATE['db_' + journal].unshift({ date, time, text });
  const sourceName = { vhod: 'Входной', arm: 'Арматурный', beton: 'Бетонный', svarka: 'Сварочный', geodez: 'Геодезический', antikor: 'Антикорр.', uhod: 'Уход', montazh: 'Монтажный', piles: 'Свайный' }[journal] || journal;
  STATE.db_obshiy.unshift({ date, time, text: `[${sourceName}] ${text}` });
}

function render() {
  renderScreen();
  saveState();
}

  const tag = document.getElementById('page-tag');

  const subViews = {
    gask_view:          ['Отчёт в ГАСК', () => STATE.currentPeriod ? gaskNum(STATE.currentPeriod) : '', renderGaskView],
    decl_view:          ['Декларация', () => 'о соответствии', renderDeclView],
    mat_view:           ['Входной контроль', () => (MATERIALS[STATE.currentMat] || {}).name || '', renderMatView],
    op_view:            ['Операционный контроль', () => STATE.currentOp || '', renderOpControl],

// ОТЧЁТЫ: ЕЖЕМЕСЯЧНЫЙ ОТЧЁТ В ГАСК
// ==========================================
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

function parseRu(s) { const [d, m, y] = String(s).split('.').map(Number); return new Date(y, m - 1, d); }
// ISO-дата из <input type="date"> — как МЕСТНАЯ полночь (new Date('YYYY-MM-DD') даёт полночь UTC и сдвигает сутки)
function isoLocal(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
function isoToRu(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s)) ? fmtRu(isoLocal(s)) : s; }
// Начало СМР — по проекту ППР: самая ранняя дата начала ТК
function worksStartDate() {
  const starts = TK_STEPS.map(s => tkRange(s[0])).filter(Boolean).map(r => r.start);
  return starts.length ? new Date(Math.min(...starts)) : new Date(2026, 10, 1);
}
function fmtRu(d) { return d.toLocaleDateString('ru-RU'); }
function pkey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function periodName(p) { const [y, m] = p.split('-').map(Number); return MONTHS[m - 1].replace(/^./, c => c.toUpperCase()) + ' ' + y; }
function gaskNum(p) { return 'ТН-' + p; }
function gaskDue(p) { const [y, m] = p.split('-').map(Number); return new Date(y, m, 5); } // 5-е число следующего месяца
function inPeriod(rec, p) { return (rec.date ? pkey(parseRu(rec.date)) : pkey(new Date())) === p; }

function gaskPeriods() {
  const out = [];
  const ws = worksStartDate();
  const sy = ws.getFullYear(), sm = ws.getMonth() + 1;
  const cur = pkey(new Date());
  let y = sy, m = sm;
  while (true) {
    const p = y + '-' + String(m).padStart(2, '0');
    out.push(p);
    if (p >= cur) break;
    m++; if (m > 12) { m = 1; y++; }
  }
  return out;
}

function gaskRec(p) {
  STATE.gaskReports = STATE.gaskReports || {};
  return STATE.gaskReports[p] = STATE.gaskReports[p] || {};
}

function gaskStatus(p) {
  const rec = (STATE.gaskReports || {})[p] || {};
  const now = new Date();
  const due = gaskDue(p);
  const [y, m] = p.split('-').map(Number);
  const periodEnd = new Date(y, m, 1);
  if (rec.sentAt) return { cls: 'ok', text: `✅ Отправлен в ГАСК ${rec.sentAt}` };
  if (now < periodEnd) return { cls: 'acc', text: `Отчётный период идёт · сдать до ${fmtRu(due)}` };
  const endOfDue = new Date(due.getFullYear(), due.getMonth(), due.getDate() + 1);
  if (now < endOfDue) {
    const left = Math.ceil((endOfDue - now) / 86400000);
    return { cls: 'warn', text: `⚠️ Сдать до ${fmtRu(due)} — осталось ${left} дн.` };
  }
  return { cls: 'bad', text: `❗ Просрочен — срок был ${fmtRu(due)}` };
}

  STATE.currentPeriod = p;
  STATE.currentView = 'gask_view';

function ovEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function ovList(key) {
  STATE.ovDirs = STATE.ovDirs || {};
  const list = STATE.ovDirs[key] = STATE.ovDirs[key] || [];
  const cur = String(STATE[key] || '').trim();
  if (cur && !list.includes(cur)) list.push(cur);   // уже введённое в актах попадает в список
  return list;
}
function ovSelect(key, sel) {
  if (sel.value === '__add') {
    const f = OVERVIEW_FIELDS.find(x => x.key === key);
    const v = (prompt(f.label + ':', '') || '').trim();
    if (v) { const list = ovList(key); if (!list.includes(v)) list.push(v); STATE[key] = v; }
  } else {
    STATE[key] = sel.value;
  }
  render();
}
function ovEdit(key) {
  const f = OVERVIEW_FIELDS.find(x => x.key === key);
  const old = String(STATE[key] || '');
  const v = (prompt('Исправить: ' + f.label, old) || '').trim();
  if (!v || v === old) return;
  const list = ovList(key), i = list.indexOf(old);
  if (i >= 0) list[i] = v; else list.push(v);
  STATE[key] = v; render();
}
function ovRemove(key) {
  const old = String(STATE[key] || '');
  if (!old || !confirm('Удалить из списка: «' + old + '»?')) return;
  const rest = ovList(key).filter(x => x !== old);
  STATE.ovDirs[key] = rest;
  STATE[key] = ''; render();
}

  title.textContent = 'Обзор';

  tag.textContent = filled + ' из ' + OVERVIEW_FIELDS.length;
  const field = f => {
    const list = ovList(f.key), cur = String(STATE[f.key] || '');
    const opts = [`<option value="" ${cur ? '' : 'selected'}>— выберите —</option>`]
      .concat(list.map(v => `<option value="${ovEsc(v)}" ${v === cur ? 'selected' : ''}>${ovEsc(v)}</option>`))
      .concat([`<option value="__add">＋ Добавить новое…</option>`]).join('');
    return `
      <div style="margin-bottom:14px">
        <div style="font-size:12px;font-weight:700;color:#334155">${f.label}</div>
        <div style="display:flex;gap:6px;margin-top:5px">

          ${cur ? `<button onclick="ovEdit('${f.key}')" title="Исправить" style="flex:0 0 40px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;cursor:pointer">✎</button>
          <button onclick="ovRemove('${f.key}')" title="Удалить из списка" style="flex:0 0 40px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;cursor:pointer">🗑</button>` : ''}
        </div>
        ${cur ? '' : `<div style="font-size:11px;color:var(--muted);margin-top:3px">${f.ph}</div>`}
      </div>`;
  };
  screen.innerHTML = `
    <div class="card">
      <div class="card-h"><h2>Объект и участники</h2><span class="tag ${filled === OVERVIEW_FIELDS.length ? 'ok' : 'warn'}">${filled}/${OVERVIEW_FIELDS.length}</span></div>
      <div class="card-b">
        ${OVERVIEW_FIELDS.map(field).join('')}
        <div style="font-size:11px;color:var(--muted)">Выбранные значения подставляются в акты, журналы и отчёты. Новое значение — «＋ Добавить новое…» в списке.</div>
      </div>
    </div>
`;
}
function setGaskField(p, key, val) { gaskRec(p)[key] = val; saveState(); }

function attachGaskPhotos(p, input) {
  const list = FILES['gask:' + p] = FILES['gask:' + p] || [];
  Array.from(input.files || []).forEach(f => { list.push({ name: f.name, type: f.type, url: URL.createObjectURL(f) }); persistFile('gask:' + p + '#' + (list.length - 1), f); });

}

function gaskPeriodEnded(p) { const [y, m] = p.split('-').map(Number); return new Date() >= new Date(y, m, 1); }

  render();
}

  const per = gaskPeriods();

  const group = g => Object.keys(DOCS).filter(id => DOCS[id].group === g);

  ];
}

// ==========================================
// ПАСПОРТ ТЕХНИЧЕСКОГО СОСТОЯНИЯ НУЛЕВОГО ЦИКЛА
// Фактические параметры для оценки НДС проектировщиком (поверочный расчёт) и
// АКТ ПРОМЕЖУТОЧНОЙ ПРИЁМКИ ОТВЕТСТВЕННЫХ КОНСТРУКЦИЙ — СН РК 1.03-00-2022, Приложение Е.
// Надземная часть открывается только после акта по форме Е и акта приёмки нулевого цикла.
// ==========================================
function PS() {
  STATE.passport = STATE.passport || {};
  const p = STATE.passport;
  ['tests', 'concrete', 'geom', 'marks', 'defects'].forEach(k => { p[k] = p[k] || []; });
  p.designer = p.designer || {};
  p.devAgreed = p.devAgreed || {};
  if (p.monitor === undefined) p.monitor = null;
  return p;
}
// Число из ввода: запятая → точка, нечисловые префиксы («B30», «≈») отбрасываются
const num = v => { const s = String(v === undefined || v === null ? '' : v).replace(',', '.').replace(/[^0-9.\-]/g, ''); return s === '' ? NaN : Number(s); };
function aosrDeviations() {
  return TK_STEPS.map(s => [s, ((STATE.aosrDev || {})[s[0]] || '').trim()])
    .filter(([, v]) => v && v.toLowerCase() !== 'отсутствуют');
}

function passportBlocks() {
  const p = PS();
  const pj = STATE.pileJournal;
  const pf = pileFieldStats();
  const pilesNote = pilesBlockNote();
  const pilesOk = pilesNote === '';
  const concOk = p.concrete.length > 0 && p.concrete.every(c => num(c.fact) >= num(c.design));
  const geomBad = p.geom.filter(g => Math.abs(num(g.fact) - num(g.design)) > num(g.tol)).length;
  const geomOk = p.geom.length > 0 && geomBad === 0;
  const markLast = m => m.cycles.length ? num(m.cycles[m.cycles.length - 1].s) : null;
  const marksOver = p.marks.filter(m => markLast(m) !== null && Math.abs(markLast(m)) > num(m.limit)).length;
  const monReq = geoMonitorRequired();
  const settleOk = (p.monitor === false && !monReq) || (p.monitor === true && p.marks.length > 0 && p.marks.every(m => m.cycles.length > 0) && marksOver === 0);
  const openDef = p.defects.filter(d => !d.fixed).length;
  const devs = aosrDeviations();
  const devOpen = devs.filter(([s]) => !p.devAgreed[s[0]]).length;
  const d = p.designer;
  const designerOk = (d.verdict === 'ok' || d.verdict === 'limited') && !!d.who;
  return [
    { key: 'piles', title: 'Свайное поле', ok: pilesOk,
      note: pilesOk ? `${pf.n} свай в норме, испытано ${pf.tests} из ≥${pf.req}, сданы по акту` : pilesNote,
      basis: 'СП РК 5.01-104-2013, пп. 7.1.6, 7.1.7, 7.3.8–7.3.14; СН РК 5.01-01-2013, п. 5.10.2.9; СН РК 5.01-03-2013, п. 5.2.16' },
    { key: 'concrete', title: 'Фактическая прочность бетона', ok: concOk,
      note: !p.concrete.length ? 'нет протоколов лаборатории' : (concOk ? `протоколов: ${p.concrete.length}, класс не ниже проектного` : 'фактический класс ниже проектного'),
      basis: 'СН РК 5.03-07-2013, п. 5.2.9.2; прил. Е, п. 4' },
    { key: 'geom', title: 'Исполнительная геометрия', ok: geomOk,
      note: !p.geom.length ? 'нет исполнительной съёмки' : (geomBad ? `вне допуска: ${geomBad}` : `замеров: ${p.geom.length}, в допуске`),
      basis: 'СН РК 1.03-03-2023, разд. 7 (приёмочный геодезический контроль); прил. Е, п. 4' },
    { key: 'settle', title: 'Осадки и деформации', ok: settleOk,
      note: (monReq && p.monitor !== true) ? `по ИГИ наблюдения обязательны (${geoSpecial().length ? 'грунты с особыми свойствами' : 'геотехническая категория 3'})` : p.monitor === null ? 'не указано, предусмотрены ли наблюдения проектом' : (p.monitor === false ? 'наблюдения проектом не предусмотрены' : (!p.marks.length ? 'нет осадочных марок' : (marksOver ? `превышение предельной осадки: ${marksOver} марк.` : `марок: ${p.marks.length}`))),
      basis: 'СН РК 5.01-01-2013, пп. 5.1.18–5.1.19; СН РК 1.03-03-2023, разд. 8; СН РК 5.01-03-2013, п. 5.2.52' },
    { key: 'defects', title: 'Дефекты', ok: openDef === 0,
      note: openDef ? `не устранено: ${openDef}` : (p.defects.length ? 'все устранены' : 'не выявлено'),
      basis: 'СН РК 1.03-00-2022, прил. В, разд. 6' },
    { key: 'devs', title: 'Отклонения от проекта', ok: devOpen === 0,
      note: !devs.length ? 'отклонений в АОСР нет' : (devOpen ? `без согласования проектировщика: ${devOpen}` : 'все согласованы'),
      basis: 'СН РК 1.03-00-2022, прил. Д, п. 4; прил. Е, п. 6' },
    { key: 'designer', title: 'Заключение проектной организации', ok: designerOk,
      note: !d.verdict ? 'нет заключения' : (d.verdict === 'strengthen' ? 'требуется усиление — приёмка невозможна' : (d.who ? (d.verdict === 'ok' ? 'соответствует проекту' : `допускается с нагружением до ${d.limitPct || '__'} %`) : 'не указан автор заключения')),
      basis: 'Авторский надзор участвует в приёмке ответственных конструкций (СН РК 1.03-00-2022, прил. В); решение о нагружении — прил. Е, п. «а»' },
    (() => { const loaded = geoLoaded(); const gti = loaded ? geoTechItems() : []; const open = gti.filter(i => !itemDone(i)).length;
      const dewOk = !loaded || !geoNeedDew() || dewPrepDone();
      return { key: 'geotech', title: 'Геотехнический контроль', ok: loaded && open === 0 && dewOk,
        note: !loaded ? 'не внесён отчёт ИГИ' : (open ? `программа надзора: не выполнено ${open} из ${gti.length}` : (!dewOk ? 'не завершены работы по водопонижению' : `категория ${GEO().cat}, программа выполнена`)),
        basis: 'СН РК 5.01-01-2013, пп. 4.2.2–4.2.7; СП РК EN 1997-1, разд. 4, прил. J' }; })()
  ];
}
function passportReady() {
  const allAosr = TK_STEPS.every(s => STATE[TK_MAP[s[0]].flag]);

// ==========================================
// КАТЕГОРИЯ ТЕХНИЧЕСКОГО СОСТОЯНИЯ ОСНОВАНИЯ И ФУНДАМЕНТОВ
// СП РК 1.04-101-2012: п. 3.19 (категории), п. 4.3.2 (рабочие: исправное, работоспособное; предельные:
// ограниченного повреждения DL, значительного повреждения SD, на грани обрушения NC — по EN 1998-3),
// пп. 4.3.5–4.3.7 (последствия), табл. Ж.2 (критерии для железобетонных конструкций).
// СП РК EN 1997-1:2004/2011, прил. H (информационное): осадки до 50 мм для обычных сооружений на отдельных
// фундаментах; относительный поворот 1/500 допустим для многих сооружений, диапазон эксплуатационного
// предельного состояния 1/2000…1/300, аварийного — около 1/150; при выгибе вверх — вдвое меньше.
// ==========================================
const TECH_CATS = [
  null,
  { name: 'Исправное', group: 'рабочее', cls: 'ok', cons: 'Строительство и эксплуатация при фактических нагрузках без ограничений (п. 4.3.5)' },
  { name: 'Работоспособное', group: 'рабочее', cls: 'ok', cons: 'Строительство без ограничений при соблюдении периодических обследований (п. 4.3.5)' },
  { name: 'Ограниченного повреждения (DL)', group: 'предельное', cls: 'warn', cons: 'Необходимы контроль состояния и конструктивное вмешательство с последующим мониторингом (п. 4.3.6). Надземная часть — после усиления и повторной оценки' },
  { name: 'Значительного повреждения (SD)', group: 'предельное', cls: 'bad', cons: 'Не допускается; обязательный режим мониторинга (п. 4.3.7)' },
  { name: 'На грани обрушения (NC)', group: 'предельное', cls: 'bad', cons: 'Не допускается; срочные страховочные мероприятия, обязательный режим мониторинга (пп. 3.19, 4.3.7)' }
];
const ZH2 = {
  I: 'I — видимых дефектов нет или отдельные раковины, волосные трещины; прочность не ниже проектной',
  II: 'II — частичные повреждения антикоррозионной защиты, высолы, следы коррозии хомутов, местное отслоение при простукивании',
  III: 'III — трещины сверх допустимого раскрытия, оголение арматуры с пластинчатой ржавчиной, бетон крошится, прочность ниже проектной',
  IV: 'IV — разрывы хомутов или стержней, выпучивание сжатой арматуры, раздробление бетона',
  V: 'V — трещины через опорную зону, смещение опор, расстройство стыков с взаимным смещением'
};
const ROMAN = { I: 1, II: 2, III: 3, IV: 4, V: 5 };
function markBeta(marks, i) {
  const m = marks[i], prev = marks[i - 1];
  if (!prev || !num(m.L) || !m.cycles.length || !prev.cycles.length) return null;
  const ds = Math.abs(num(m.cycles[m.cycles.length - 1].s) - num(prev.cycles[prev.cycles.length - 1].s)) / 1000;
  return ds / num(m.L);
}
function techCondition() {
  const p = PS(), r = [];
  const add = (cat, text, basis) => r.push({ cat, text, basis });
  // бетон: табл. Ж.2 — кат. I/II прочность не ниже проектной; кат. III — ниже проектной, снижение до 20–30 %
  p.concrete.forEach(c => {
    const k = num(c.fact) / num(c.design);
    if (k < 0.8) add(4, `${c.el}: фактический класс B${c.fact} ниже проектного более чем на 20 % — за пределами критериев кат. III, требуется экспертное обследование`, 'СП РК 1.04-101-2012, табл. Ж.2');
    else if (k < 1) add(3, `${c.el}: прочность ниже проектной (B${c.fact} при B${c.design})`, 'табл. Ж.2, кат. III');
  });
  // сваи: несущая способность по испытаниям ниже проектной нагрузки
  p.tests.forEach(t => { if (num(t.fact) < num(t.design)) add(3, `свая № ${t.pile}: ${t.fact} кН ниже проектной нагрузки ${t.design} кН`, 'СП РК EN 1997-1, п. 7.5.2.3(2)P; снижение несущей способности — кат. III'); });
  // дефекты по табл. Ж.2 (только неустранённые)
  p.defects.filter(d => !d.fixed).forEach(d => { const c = ROMAN[d.cat || 'I'] || 1; if (c >= 2) add(c, `дефект ${d.type} (${d.axis}) — кат. ${d.cat} по табл. Ж.2`, 'СП РК 1.04-101-2012, табл. Ж.2'); });
  // геометрия вне допуска — работоспособное, если работоспособность подтверждена проектировщиком
  const geomBad = p.geom.filter(g => Math.abs(num(g.fact) - num(g.design)) > num(g.tol)).length + pileFieldStats().bad;
  if (geomBad) add(p.designer.verdict === 'ok' || p.designer.verdict === 'limited' ? 2 : 3, `отклонения от проекта вне допуска: ${geomBad}`, 'п. 3.19 — работоспособное, если несущая способность обеспечивается');
  // осадки и относительный поворот — EN 1997-1, прил. H
  if (p.monitor) p.marks.forEach((m, i) => {
    const last = m.cycles.length ? Math.abs(num(m.cycles[m.cycles.length - 1].s)) : null;
    if (last !== null && last > num(m.limit)) add(3, `марка ${m.name}: осадка ${last} мм больше предельной ${m.limit} мм`, 'СН РК 5.01-03-2013, п. 5.2.52');
    const b = markBeta(p.marks, i);
    if (b !== null) {
      const inv = Math.round(1 / Math.max(b, 1e-9));
      if (b >= 1 / 150) add(4, `относительный поворот ${m.name}: 1/${inv} — на уровне аварийного предельного состояния (≈1/150)`, 'СП РК EN 1997-1, прил. H');
      else if (b > 1 / 300) add(3, `относительный поворот ${m.name}: 1/${inv} — вне диапазона эксплуатационной пригодности (до 1/300)`, 'СП РК EN 1997-1, прил. H');
      else if (b > 1 / 500) add(2, `относительный поворот ${m.name}: 1/${inv} — больше 1/500, допустимость подтверждает проектировщик`, 'СП РК EN 1997-1, прил. H');
    }
  });
  if (p.designer.verdict === 'strengthen') add(3, 'проектная организация требует усиления', 'СП РК 1.04-101-2012, п. 4.3.6');
  const cat = r.length ? Math.max(...r.map(x => x.cat)) : 1;
  return { cat, info: TECH_CATS[cat], reasons: r.sort((a, b) => b.cat - a.cat), ok: cat <= 2 };
}

function settleSvg(m) {
  const vals = m.cycles.map(c => num(c.s));
  const lim = num(m.limit);
  const maxV = Math.max(lim, ...vals.map(Math.abs), 1) * 1.15;
  const W = 300, H = 90;
  const x = i => vals.length < 2 ? W / 2 : 10 + i * (W - 20) / (vals.length - 1);
  const y = v => 8 + Math.abs(v) / maxV * (H - 16);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" aria-label="График осадки марки ${m.name}">
    <line x1="0" x2="${W}" y1="${y(lim)}" y2="${y(lim)}" stroke="#dc2626" stroke-dasharray="5 4" stroke-width="1.5"/>
    ${vals.length > 1 ? `<polyline fill="none" stroke="#2563eb" stroke-width="2.5" points="${vals.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>` : ''}
    ${vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${Math.abs(v) > lim ? '#dc2626' : '#2563eb'}"/>`).join('')}
  </svg>`;
}

// ==========================================
// КАРТА СВАЙНОГО ПОЛЯ — исполнительная схема по каждой свае
// СП РК 5.01-104-2013: п. 7.1.6 (критический отказ 0,2 см), пп. 7.3.8–7.3.12 (каждая свая: положение в плане,
// вертикальность, глубина погружения), п. 7.3.14 (испытания не менее 3 свай и не менее 10 %), п. 7.1.7 (сдача свай
// проектировщику по акту). Числовые допуски на положение свай задаются проектом.
// ==========================================
function pileLayout() {
  const pl = proj().piles;
  if (pl && Array.isArray(pl.items) && pl.items.length) return pl;
  const ax = ['1', '2', '3', '4'].map((n, i) => ({ n, x: i * 6000 }));
  const ay = ['А', 'Б', 'В', 'Г'].map((n, i) => ({ n, y: i * 6000 }));
  const items = []; let no = 1;
  ay.forEach(a => ax.forEach(b => [[-450, -450], [450, -450], [-450, 450], [450, 450]].forEach(([dx, dy]) =>
    items.push({ no: String(no++), x: b.x + dx, y: a.y + dy, node: b.n + '/' + a.n }))));
  return { axesX: ax, axesY: ay, items, headMark: '-2.150', demo: true };
}
function pileTol() { STATE.pileTol = STATE.pileTol || {}; return STATE.pileTol; }
// Допуск в плане: по проекту; если не задан — ТКСН РК 8.07-06-2017, табл. 6: крайние сваи 0,2d, средние 0,4d
function pileD() { return num(String(STATE.pileJournal.pileSection).split(/[×x*]/)[0]) || 300; }
function pileIsEdge(no) {
  const L = pileLayout();
  const it = L.items.find(i => i.no === String(no));
  if (!it) return true;
  const grp = it.node ? L.items.filter(i => i.node === it.node) : L.items;
  const xs = grp.map(i => i.x), ys = grp.map(i => i.y);
  const mid = it.x > Math.min(...xs) && it.x < Math.max(...xs) && it.y > Math.min(...ys) && it.y < Math.max(...ys);
  return !mid;
}
function planTolFor(no) {
  const t = num(pileTol().plan);
  if (t) return { val: t, src: 'проект' };
  const edge = pileIsEdge(no);
  return { val: Math.round(pileD() * (edge ? 0.2 : 0.4)), src: `${edge ? 'крайняя 0,2d' : 'средняя 0,4d'}, ТКСН РК 8.07-06-2017` };
}
function vertTol() {
  const t = num(pileTol().vert);
  return t ? { val: t, src: 'проект' } : { val: 2, src: 'ТКСН РК 8.07-06-2017' };
}
function pileFacts() { STATE.pileFacts = STATE.pileFacts || {}; return STATE.pileFacts; }
function pilesTestsRequired(n) { return Math.max(3, Math.ceil(n * 0.1)); }

function pileStatus(no) {
  const L = pileLayout(), tol = pileTol();
  const f = pileFacts()[no] || {};
  const z = lastZalogs().byPile[no];
  const test = PS().tests.find(t => String(t.pile) === String(no));
  const testOk = test ? num(test.fact) >= num(test.design) : null;
  const issues = [], bad = [];
  if (!z) return { cls: 'none', issues: ['нет залога — свая не забита или не внесена'], f, z, test };
  const ev = zalogEval(z);
  if (ev.over && testOk !== true) issues.push(`отказ ${z.refusal} см больше расчётного — добивка после «отдыха» или испытание`);
  const has = k => f[k] !== undefined && String(f[k]).trim() !== '';
  let planDev = null, headDev = null;
  if (!(has('dx') && has('dy') && has('head') && has('vert'))) issues.push('нет исполнительных замеров (план, отметка, вертикаль)');
  else {
    planDev = Math.round(Math.hypot(num(f.dx), num(f.dy)));
    headDev = Math.round((num(f.head) - num(L.headMark)) * 1000);
    const pt = planTolFor(no);
    if (planDev > pt.val) bad.push(`смещение в плане ${planDev} мм > ${pt.val} мм (${pt.src})`);
    if (num(tol.head) && Math.abs(headDev) > num(tol.head)) bad.push(`отметка головы ${headDev > 0 ? '+' : ''}${headDev} мм вне допуска ±${tol.head}`);
    const vt = vertTol();
    if (num(f.vert) > vt.val) bad.push(`отклонение от вертикали ${f.vert} % > ${vt.val} % (${vt.src})`);
  }
  if (testOk === false) bad.push(`испытание: ${test.fact} кН < ${test.design} кН`);
  return { cls: bad.length ? 'bad' : (issues.length ? 'warn' : 'ok'), issues: bad.concat(issues), f, z, test, planDev, headDev, crit: ev.crit };
}
function pileFieldStats() {
  const L = pileLayout(), tol = pileTol();
  const sts = L.items.map(it => pileStatus(it.no));
  const n = L.items.length, req = pilesTestsRequired(n);
  const tests = PS().tests;
  const testsOk = tests.every(t => num(t.fact) >= num(t.design));
  const c = k => sts.filter(s => s.cls === k).length;
  const tolSet = !!num(tol.head); // план и вертикаль — по ТКСН РК 8.07-06-2017, если проект не задал
  return { n, req, tests: tests.length, testsOk, ok: c('ok'), warn: c('warn'), bad: c('bad'), none: c('none'), tolSet, handover: !!STATE.pileHandover };
}

// CSV исполнительной схемы: №;dx;dy;отметка головы;вертикаль %;отказ см (последний столбец — необязательный)
function importPileCsv(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (!pileWorkOpen()) { alert('Свайные работы не открыты: ' + tkLockText(1)); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const F = pileFacts(); let n = 0;
    String(rd.result).split(/\r?\n/).forEach(line => {
      const c = line.split(/[;\t]/).map(s => s.trim());
      if (c.length < 5 || !/^\d+$/.test(c[0])) return;
      F[c[0]] = { dx: c[1].replace(',', '.'), dy: c[2].replace(',', '.'), head: c[3].replace(',', '.'), vert: c[4].replace(',', '.') };
      if (c[5]) STATE.pileJournal.hammerZalogs.push({ hits: '', refusal: c[5].replace(',', '.'), pile: c[0] });
      n++;
    });
    addToJournal('piles', `Импорт исполнительной схемы свайного поля: ${n} свай`);
    if (!n) alert('Строки не распознаны. Формат: №;dx мм;dy мм;отметка головы м;вертикаль %;отказ см');
    render();
  };
  rd.readAsText(file, 'utf-8');
}

function pilesBlockNote() {
  const st = pileFieldStats();
  const r = [];
  if (!num(STATE.pileJournal.designRefusal)) r.push('не задан расчётный отказ');
  if (!st.tolSet) r.push('не задан допуск по отметке головы (проект)');
  if (st.none) r.push(`не внесено свай: ${st.none}`);
  if (st.warn) r.push(`требуют действий: ${st.warn}`);
  if (st.bad) r.push(`вне допуска: ${st.bad}`);
  if (st.tests < st.req) r.push(`испытано ${st.tests} из ≥${st.req}`);
  if (!st.testsOk) r.push('есть испытания ниже проекта');
  if (!st.handover) r.push('сваи не сданы проектировщику по акту');
  return r.join('; ');
}

// ГЕОЛОГИЯ: ОТЧЁТ ОБ ИГИ → СТРОИТЕЛЬНОЕ ВОДОПОНИЖЕНИЕ И ГЕОТЕХНИЧЕСКИЙ КОНТРОЛЬ
// СП РК 5.01-101-2013, разд. 4.2 (водопонижение); СН РК 5.01-01-2013, пп. 4.2.2–4.2.7 (геотехнический надзор
// по категории), пп. 5.2, 5.3 (водопонижение, водоотвод), п. 5.1.19 (наблюдения на грунтах с особыми свойствами),
// п. 5.9.18 (существующие сооружения рядом с котлованом).
// ==========================================
function GEO() {
  STATE.geo = STATE.geo || {};
  const g = STATE.geo;
  g.report = g.report || {};
  g.layers = g.layers || [];
  g.checks = g.checks || {};
  g.journal = g.journal || [];
  return g;
}
const SPECIAL_SOILS = ['нет', 'просадочный', 'набухающий', 'засолённый', 'насыпной', 'слабый водонасыщенный', 'органо-минеральный'];
function geoBottom() { return STATE.levelProject ? num(STATE.levelProject) : null; }
function geoLoaded() { const g = GEO(); return !!(g.cat && g.gwl !== undefined && g.gwl !== '' && g.layers.length); }
function geoNeedDew() { const g = GEO(), b = geoBottom(); return geoLoaded() && b !== null && num(g.gwl) > b; }
function geoS() { return Math.round((num(GEO().gwl) - geoBottom()) * 100) / 100; }
// Слои в зоне осушения: интервал слоя пересекает [дно котлована; УПВ]
function geoZoneLayers() {
  const g = GEO(), b = geoBottom();
  let top = num(g.surface || 0);
  const out = [];
  g.layers.forEach(l => { const bot = num(l.bottom); if (b !== null && top > b && bot < num(g.gwl)) out.push(l); top = bot; });
  return out.length ? out : g.layers.slice(-1);
}
function geoKf() { const ks = geoZoneLayers().map(l => num(l.kf)).filter(k => k > 0); return ks.length ? Math.min(...ks) : null; }
// Способ водопонижения по коэффициенту фильтрации и глубине понижения — СП РК 5.01-101-2013, пп. 4.2.3, 4.2.6–4.2.8
function geoMethod(K, S) {
  if (K === null) return { text: 'задайте коэффициент фильтрации слоёв в зоне осушения', basis: '' };
  if (K >= 2) {
    if (S > 4) return { text: 'Открытые гравитационные водопонизительные скважины с погружными насосами', basis: 'п. 4.2.6: Kф не менее 2 м/сут при понижении более 4 м', wells: true };
    if (K <= 50) return { text: 'Иглофильтры гравитационного водопонижения, одной ступенью до 4–5 м', basis: 'п. 4.2.7: Kф от 2 до 50 м/сут', wells: true };
    return { text: 'Водопонизительные скважины с погружными насосами (сильнопроницаемые грунты)', basis: 'СН РК 5.01-01-2013, п. 5.2.8', wells: true };
  }
  if (K >= 0.2) {
    const alt = 'пластовый дренаж в котловане (п. 4.2.8: Kф менее 2 м/сут)';
    if (S <= 7) return { text: 'Вакуумные иглофильтры (одной ступенью 5–7 м) или вакуумные скважины; ' + alt, basis: 'пп. 4.2.6, 4.2.7: Kф от 0,2 до 2 м/сут', wells: true };
    if (S <= 12) return { text: 'Эжекторные иглофильтры (понижение до 10–12 м); ' + alt, basis: 'п. 4.2.7', wells: true };
    return { text: 'Эжекторные иглофильтры до 20 м — только при обосновании в проекте', basis: 'п. 4.2.7', wells: true };
  }
  return { text: 'Пластовый дренаж с открытым водоотливом; при необходимости — электроосмос (по проекту)', basis: 'пп. 4.2.3, 4.2.8: малопроницаемые грунты', wells: false };
}
function geoSpecial() { return GEO().layers.filter(l => l.special && l.special !== 'нет'); }
function geoMonitorRequired() { return geoLoaded() && (geoSpecial().length > 0 || String(GEO().cat) === '3'); }
// Работы по водопонижению до начала разработки (все, кроме итоговых — ликвидации скважин)
function dewPrepDone() { return DEW_ITEMS.filter(i => !i.final && (!i.show || i.show())).every(itemDone); }

// --- журнал водопонижения (СП РК 5.01-101-2013, п. 4.2.36) ---
function dewMeasures() { return GEO().journal.filter(r => r.upv !== '' && r.upv !== undefined).sort((a, b) => parseRu(a.date) - parseRu(b.date)); }
function dewInitialOk() {
  const g = GEO(); if (!g.start) return false;
  const st = isoLocal(g.start);
  return dewMeasures().some(r => parseRu(r.date) <= st);
}
function dewIntervalOk() {
  const m = dewMeasures(); if (m.length < 1) return false;
  for (let i = 1; i < m.length; i++) if ((parseRu(m[i].date) - parseRu(m[i - 1].date)) / 86400000 > 10) return false;
  return GEO().liquidated || (new Date() - parseRu(m[m.length - 1].date)) / 86400000 <= 10;
}
function dewAquifersOk() {
  const n = Math.max(1, num(GEO().aquifers) || 1);
  return new Set(dewMeasures().map(r => r.horizon || '1')).size >= n;
}
function dewLead() {
  const withExc = dewMeasures().filter(r => r.exc !== '' && r.exc !== undefined);
  if (!withExc.length) return null;
  const r = withExc[withExc.length - 1];
  return { lead: Math.round((num(r.exc) - num(r.upv)) * 100) / 100, r };
}
function dewLeadOk() { const l = dewLead(); return !!l && l.lead >= 2.5; }

function itemDone(it) { return it.auto ? !!it.auto() : !!GEO().checks[it.id]; }

function setGeo(k, v) { GEO()[k] = v; render(); }
function setGeoRep(k, v) { GEO().report[k] = v; saveState(); }
function toggleGeo(id, v) { GEO().checks[id] = v; render(); }
function addGeoLayer() {
  const l = { name: jv('gl-name'), bottom: jv('gl-bot').replace(',', '.'), kf: jv('gl-kf').replace(',', '.'), special: jv('gl-sp') || 'нет' };
  if (!l.name || l.bottom === '') { alert('Укажите ИГЭ и отметку подошвы'); return; }
  GEO().layers.push(l); render();
}
function delGeoLayer(i) { GEO().layers.splice(i, 1); render(); }
function addDewEntry() {
  const r = { date: jv('dj-date') ? isoToRu(jv('dj-date')) : today(), well: jv('dj-well'), horizon: jv('dj-hor') || '1', upv: jv('dj-upv').replace(',', '.'), flow: jv('dj-flow').replace(',', '.'), exc: jv('dj-exc').replace(',', '.'), event: jv('dj-ev') };
  if (r.upv === '' && !r.event) { alert('Внесите УПВ или событие'); return; }
  GEO().journal.push(r);
  addToJournal('obshiy', `Водопонижение ${r.date}: ${r.upv !== '' ? 'УПВ ' + r.upv + ' м' : ''}${r.flow ? ', дебит ' + r.flow + ' м³/ч' : ''}${r.event ? ', ' + r.event : ''}`);
  render();
}
function attachGeoReport(input) {
  const f = input.files && input.files[0]; if (!f) return;
  FILES['geo:report'] = { name: f.name, type: f.type, url: URL.createObjectURL(f) };
  persistFile('geo:report', f);
  addToJournal('obshiy', `Загружен отчёт об инженерно-геологических изысканиях: ${f.name}`);
  render();
}
function importGeoJson(input) {
  const file = input.files && input.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let d; try { d = JSON.parse(rd.result); } catch (e) { alert('Файл не является JSON'); return; }
    const g = GEO();
    ['cat', 'gwl', 'surface', 'aquifers', 'aggr', 'neighbors', 'pressure'].forEach(k => { if (d[k] !== undefined) g[k] = d[k]; });
    if (d.report) g.report = d.report;
    if (Array.isArray(d.layers)) g.layers = d.layers;
    addToJournal('obshiy', 'Импортированы параметры отчёта об ИГИ');
    render();
  };
  rd.readAsText(file, 'utf-8');
}

// ЛОГИКА
// Входной контроль: приёмка только по документам о качестве (СН РК 5.03-07-2013, п. 4.2.13;
// СП РК 5.01-104-2013, п. 7.2.1 — каждая партия свай; СН РК 5.01-01-2013, п. 5.10.2.1 — паспорта на сваи)
function acceptMat(type, status) {
  const m = MATERIALS[type];
  if (!m) return;
  const prev = STATE[m.key] || 'pending';
  const key = d => 'mat:' + type + ':' + d.id;
  if (status === 'ok') {
    if (!m.docs.some(d => d.kind !== 'Протокол' && hasFile(key(d)))) { alert('Прикрепите документ о качестве партии (паспорт или сертификат) — без него материал не принимается'); return; }
    if (prev === 'protocol' && !m.docs.some(d => d.kind === 'Протокол' && hasFile(key(d)))) { alert('Затребован протокол испытаний — прикрепите его, затем примите партию'); return; }
  }
  STATE[m.key] = status;
  addToJournal('vhod', `${m.name} — ${{ ok: 'принят', protocol: 'затребован протокол испытаний', rejected: 'партия забракована', pending: 'новая партия на входной контроль' }[status]}`);
  render();
}

function addZalog() {
  if (!pileWorkOpen()) { alert('Свайные работы не открыты: ' + tkLockText(1)); return; }
  const hits = document.getElementById('inp-hits').value;
  const refusal = document.getElementById('inp-refusal').value;

  if (!hits || !refusal) {
    alert('⚠️ Введите количество ударов и величину отказа!');
    return;
  }

  const pileEl = document.getElementById('inp-pile');
  const pile = pileEl ? String(pileEl.value || '').trim() : '';
  const z = { hits, refusal, pile };
  STATE.pileJournal.hammerZalogs.push(z);
  const ev = zalogEval(z);
  addToJournal('piles', `${pile ? 'Свая № ' + pile + ': ' : ''}залог ${hits} ударов, отказ ${refusal} см${ev.over ? ' — больше расчётного, требуется добивка' : ''}${ev.crit ? ' — критический отказ' : ''}`);
  render();
}

// Отказ залога: против расчётного (СН РК 5.01-01-2013, п. 5.10.2.9) и критический 0,2 см (СП РК 5.01-104-2013, п. 7.1.6)
const CRIT_REFUSAL_CM = 0.2;
function zalogEval(z) {
  const d = Number(STATE.pileJournal.designRefusal);
  const r = Number(String(z.refusal).replace(',', '.'));
  const crit = r <= CRIT_REFUSAL_CM;
  if (!d) return { text: crit ? 'критический' : '—', over: false, ok: false, crit };
  if (r > d) return { text: 'больше расч.', over: true, ok: false, crit };
  return { text: crit ? 'критический (≤0,2)' : 'в норме', over: false, ok: true, crit };
}
// Последний залог каждой сваи (по номеру); залоги без номера учитываются по отдельности
function lastZalogs() {
  const byPile = {}, loose = [];
  STATE.pileJournal.hammerZalogs.forEach(z => { if (z.pile) byPile[z.pile] = z; else loose.push(z); });
  return { byPile, loose };
}
function pileOverCount() {
  const { byPile, loose } = lastZalogs();
  return Object.values(byPile).concat(loose).filter(z => zalogEval(z).over).length;
}
function setPileField(key, val) {
  STATE.pileJournal[key] = val;
  if (key === 'designRefusal') addToJournal('piles', `Принят расчётный отказ по проекту: ${val} см`);
  render();
}

// Нивелировка дна котлована: ≥10 измерений, |отклонение| ≤ 5 см (СП РК 5.01-101-2013, табл. 3, п. 5)
const LEVEL_TOL_CM = 5, LEVEL_MIN_N = 10;
function levelDev(pt) {
  const pr = Number(String(STATE.levelProject || '').replace(',', '.'));
  const f = Number(String(pt.fact).replace(',', '.'));
  if (!STATE.levelProject || isNaN(pr) || isNaN(f)) return null;
  return Math.round((f - pr) * 1000) / 10; // см, 1 знак
}
function levelCheck() {
  const pts = STATE.levelPoints || [];
  const devs = pts.map(levelDev).filter(d => d !== null);
  const over = devs.filter(d => Math.abs(d) > LEVEL_TOL_CM).length;
  const ok = !!STATE.levelProject && devs.length >= LEVEL_MIN_N && over === 0;
  const note = !STATE.levelProject ? 'не задана проектная отметка дна'
    : `измерений ${devs.length} из ≥${LEVEL_MIN_N}${over ? `, превышений допуска: ${over}` : ''}`;
  return { ok, over, n: devs.length, note };
}

// ТК-Засып: обратная засыпка пазух — СН РК 5.01-01-2013, п. 5.9.26; СП РК 5.01-101-2013, пп. 4.3.4.3, 4.3.4.22, 4.3.4.30, табл. А.1
function BF() { STATE.backfill = STATE.backfill || {}; STATE.backfill.tests = STATE.backfill.tests || []; return STATE.backfill; }
// табл. А.1, п. 7: средняя плотность сухого грунта не ниже проектной; отдельные значения ниже проектной
// не более чем на 0,06 г/см³ и не более чем в 20 % определений
function bfStats() {
  const b = BF(), d = num(b.design), v = b.tests.map(t => num(t.rho)).filter(x => !isNaN(x));
  if (!d || !v.length) return { ok: false, n: v.length, avg: null, note: !d ? 'не задана проектная плотность' : 'нет определений' };
  const avg = Math.round(v.reduce((s, x) => s + x, 0) / v.length * 1000) / 1000;
  const below = v.filter(x => x < d).length, tooLow = v.filter(x => x < d - 0.06).length;
  const ok = avg >= d && tooLow === 0 && below / v.length <= 0.2;
  return { ok, n: v.length, avg, below, tooLow, note: ok ? `средняя ${avg} ≥ ${d}; ниже проектной ${below} из ${v.length}` : (avg < d ? `средняя ${avg} ниже проектной ${d}` : (tooLow ? `${tooLow} определ. ниже проектной более чем на 0,06` : `ниже проектной ${below} из ${v.length} (> 20 %)`)) };
}
function addBfTest() { const pt = jv('bf-pt'), rho = jv('bf-rho').replace(',', '.'); if (!rho) { alert('Введите плотность сухого грунта, г/см³'); return; } BF().tests.push({ pt, rho, date: today() }); render(); }
function setBfDesign(v) { BF().design = String(v).replace(',', '.'); render(); }

function normItemDone(spec, it) {
  if (it.auto) return typeof it.auto === 'function' ? !!it.auto() : !!STATE[it.auto];
  return !!(STATE[spec.checks] && STATE[spec.checks][it.id]);
}
function toggleNorm(checksKey, id, val) {
  STATE[checksKey] = STATE[checksKey] || {};
  STATE[checksKey][id] = val;
  render();
}

function opStats(spec) {
  const all = spec.norms.flatMap(g => g.items);
  const done = all.filter(it => normItemDone(spec, it)).length;
  return { all: all.length, done, complete: done === all.length };
}

function renderOpControl(screen) {
  const code = STATE.currentOp;
  const spec = AOSR_SPECS[code];
  const step = TK_STEPS.find(s => s[0] === code);
  if (!spec || !step) { nav('control'); return; }
  const all = spec.norms.flatMap(g => g.items);
  const done = all.filter(it => normItemDone(spec, it)).length;
  const canSign = done === all.length;
  const isSigned = STATE[spec.flag];

  screen.innerHTML = `
    <div class="card"><div class="card-b">
      <div style="font-size:16px;font-weight:800">Операционный контроль</div>
      <div style="font-size:12px;color:#64748b;margin:4px 0 8px">${code} · ${step[1]} · ${spec.subtitle}</div>
      <div class="journal-row"><span style="color:var(--muted)">Основание</span><span style="font-weight:600;text-align:right">${spec.basis}</span></div>
      <div class="journal-row"><span style="color:var(--muted)">Выполнено пунктов</span><span style="font-weight:600;color:${canSign ? 'var(--ok)' : 'var(--warn)'}">${done} из ${all.length}</span></div>
    </div></div>

    ${spec.intro}

    ${spec.norms.map(g => `
      <div class="card">
        <div class="card-h"><h2>${g.group}</h2></div>
        <div class="card-b">
          ${g.items.map(it => {
            const ok = normItemDone(spec, it);
            const hint = typeof it.hint === 'function' ? it.hint() : it.hint;
            const src = it.autoSrc || 'журнале геодезических работ';
            if (it.auto) return `
              <div class="check-item" style="${ok ? '' : 'border-color:#fde68a;background:var(--warn-soft)'}">
                <span style="font-size:16px">${ok ? '✅' : '⏳'}</span>
                <label style="cursor:default">${it.text}
                  <div style="font-size:11px;color:var(--muted);font-weight:400">${ok ? 'Подтверждено в ' + src : 'Внесите данные в ' + src}${hint ? ' · ' + hint : ''}</div>
                </label>
              </div>`;
            return `
              <div class="check-item">
                <input type="checkbox" id="e_${it.id}" ${ok ? 'checked' : ''} ${isSigned ? 'disabled' : ''} onchange="toggleNorm('${spec.checks}', '${it.id}', this.checked)">
                <label for="e_${it.id}">${it.text}${hint ? `<div style="font-size:11px;color:var(--muted);font-weight:400">${hint}</div>` : ''}</label>
              </div>`;
          }).join('')}
        </div>
      </div>
    `).join('')}

    ${spec.extraHtml ? spec.extraHtml() : ''}
    ${!tkStepOpen(TK_STEPS.indexOf(step)) && !isSigned ? `<div class="warning-block">🔒 ${tkLockText(TK_STEPS.indexOf(step))}</div>` : ''}
    <button class="btn ${canSign && !isSigned ? 'primary' : (isSigned ? 'success' : '')}" onclick="openAOSRForTK('${code}', '${step[1]}', '${step[2]}')" ${(canSign && tkStepOpen(TK_STEPS.indexOf(step))) || isSigned ? '' : 'disabled'}>
      ${isSigned ? '📄 АОСР подписан — открыть' : (canSign ? '✓ Передать в приёмочный контроль (АОСР)' : `🔒 Осталось пунктов: ${all.length - done}`)}
    </button>
    ${spec.extraBtn || ''}
    <button class="btn" onclick="STATE.currentView='journal_geodez_view'; render()">Журнал геодезии</button>
    <button class="btn" onclick="nav('control')">Закрыть</button>
  `;
}

// Условия подписания АОСР — те же ворота этапа + полный операционный контроль + реквизиты участников
function aosrBlockers(code) {
  const b = [];
  const idx = TK_STEPS.findIndex(s => s[0] === code);
  if (!tkStepOpen(idx)) b.push(tkLockText(idx));
  const spec = AOSR_SPECS[code];
  if (spec) { const s = opStats(spec); if (!s.complete) b.push(`Завершить «Операционный контроль» по ${code} — осталось пунктов: ${s.all - s.done}`); }
  const miss = [['objName', 'объект'], ['gpName', 'представитель подрядчика'], ['tnName', 'представитель технадзора'], ['anName', 'представитель авторского надзора']]
    .concat((AOSR_EXTRA[code] || []).length ? [['geoName', 'дополнительный участник (геолог)']] : [])
    .filter(([k]) => !String(STATE[k] || '').trim()).map(([, t]) => t);
  if (miss.length) b.push('Заполнить реквизиты акта: ' + miss.join(', '));
  return b;
}
function aosrMatsText(code) {
  const mats = Object.keys(MATERIALS).filter(id => MATERIALS[id].tk === code);
  return mats.length ? mats.map(id => `${MATERIALS[id].name} — ${MATERIALS[id].docs.map(d => d.kind.toLowerCase() + ' № ' + d.num()).join(', ')}`).join('<br>') : 'материалы не применялись';
}
function aosrEvidenceText(code) { return (AOSR_EVIDENCE[code] ? AOSR_EVIDENCE[code]() : []).join('; ') || '—'; }

function signAOSR() {
  const tk = STATE.currentTK;
  if (aosrBlockers(tk.code).length) return;
  const m = TK_MAP[tk.code];
  if (m) {
    STATE[m.flag] = true;
    STATE[m.date] = today();
    // снимок содержимого акта на момент подписания — подписанный акт не меняется при последующих изменениях данных
    STATE.aosrSnap = STATE.aosrSnap || {};
    STATE.aosrSnap[tk.code] = { mats: aosrMatsText(tk.code), evidence: aosrEvidenceText(tk.code), date: today() };
  }
  addToJournal('obshiy', `Подписан АОСР: ${tk.code} · ${tk.name}`);
  alert(`✅ АОСР по "${tk.name}" подписан!`);
  STATE.currentView = 'ppr_main_view';
  render();
}

  addToJournal('obshiy', 'Подписан акт приёмки нулевого цикла');

  addToJournal('geodez', `Проектная отметка дна котлована: ${STATE.levelProject} м`);
  render();
}
function addLevelPoint() {
  const pt = document.getElementById('lv-pt').value.trim();
  const fact = document.getElementById('lv-f').value.trim().replace(',', '.');
  if (!pt || fact === '' || isNaN(Number(fact))) { alert('Введите точку и фактическую отметку, м'); return; }
  STATE.levelPoints = STATE.levelPoints || [];
  STATE.levelPoints.push({ pt, fact });
  const d = levelDev({ fact });
  addToJournal('geodez', `Нивелировка дна, т. ${pt}: ${fact} м${d !== null ? ` (откл. ${d > 0 ? '+' : ''}${d} см${Math.abs(d) > LEVEL_TOL_CM ? ' — сверх допуска' : ''})` : ''}`);
  render();
}
function delLevelPoint(i) { STATE.levelPoints.splice(i, 1); render(); }

function confirmGeoVolume(type) {
  const flagKey = 'confirmed' + type.charAt(0).toUpperCase() + type.slice(1);
  const label = { axes: 'разбивка осей', survey: 'съёмка котлована', vertical: 'контроль вертикальности' }[type] || type;
  const val = Number(STATE[GEO_VAL[type]]) || 0;
  if (val <= 0) { alert('Введите выполненный объём, %'); return; }
  // объём засчитывается в АОСР только полностью выполненным; частичный — фиксируется в журнале
  if (val < 100) { addToJournal('geodez', `Выполнено частично: ${label} — ${val}%`); render(); return; }
  STATE[flagKey] = true;
  addToJournal('geodez', `Технадзор подтвердил объём: ${label} — ${val}%`);
  render();
}

const PR_WORKS = [];   // наполняется блоками работ (pr_works_*.js)
const PR = { fio: '', group: '', answers: {}, results: {}, visited: false };
function prLoad() { try { const s = JSON.parse(localStorage.getItem(PR_KEY)); if (s) Object.assign(PR, s); } catch (e) {} }
function prSave() { try { localStorage.setItem(PR_KEY, JSON.stringify(PR)); } catch (e) {} }
function prFirstRun() { prLoad(); const f = !PR.visited; PR.visited = true; prSave(); return f; }

// ---------- помощники автопроверки
const prEsc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
function prD(s) {   // дата дд.мм.гггг → Date или null
  const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(String(s || '').trim());
  if (!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1]);
  return d.getDate() === +m[1] && d.getMonth() === +m[2] - 1 ? d : null;
}
function prN(v) { const x = num(v); return isNaN(x) ? null : x; }
const prArr = v => Array.isArray(v) ? v : [];
const prSame = (a, b) => prArr(a).length === b.length && b.every(x => prArr(a).includes(x));
const prC = (id, text, ok, pts, hint, crit) => ({ id, text, ok: !!ok, pts: pts || 1, hint: hint || '', crit: !!crit });
const prL = (c, n) => [c, n];
function prTable(head, rows) {
  return `<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:11.5px;margin:6px 0">
    <tr>${head.map(h => th(h)).join('')}</tr>${rows.map(r => `<tr>${r.map(v => td(String(v))).join('')}</tr>`).join('')}</table></div>`;
}
function prDoc(title, sub) {
  return `<div class="doc-header"><div class="pr-demo-mark">ДЕМО · учебный документ</div><h2>${title}</h2>${sub ? `<div style="font-size:11px;color:#64748b">${sub}</div>` : ''}</div>`;
}
function prWork(id) { return PR_WORKS.find(w => w.id === id); }
function prAnswers(id) { PR.answers[id] = PR.answers[id] || {}; return PR.answers[id]; }

// Оценка: баллы по критериям; зачёт — процент не ниже порога и выполнены все критичные критерии
function prEval(w, a) {
  const items = w.check(a || {});
  const max = items.reduce((s, i) => s + i.pts, 0);
  const score = items.reduce((s, i) => s + (i.ok ? i.pts : 0), 0);
  const pct = max ? Math.round(score / max * 100) : 0;
  const pass = pct >= (w.pass || 80) && items.every(i => i.ok || !i.crit);
  return { items, score, max, pct, pass };
}

// ---------- ввод ответов (без перерисовки — не сбивать фокус)
function prAns(w, f, v) { prAnswers(w)[f] = String(v).trim(); prSave(); }
function prToggle(w, f, v, on) {
  const a = prAnswers(w); const s = prArr(a[f]).filter(x => x !== v);
  if (on) s.push(v);
  a[f] = s; prSave();
}
function prFieldHtml(w, f) {
  const v = (PR.answers[w.id] || {})[f.id];
  const st = 'width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;font-size:13px;margin-top:4px';
  const on = `prAns('${w.id}','${f.id}',this.value)`;
  let h = `<div style="font-size:12.5px;font-weight:600;margin-top:14px">${f.label}</div>` +
    (f.note ? `<div style="font-size:11px;color:var(--muted)">${f.note}</div>` : '');
  if (f.type === 'select') {
    h += `<select style="${st}" onchange="${on}"><option value="">— выберите —</option>${f.options.map(o =>
      `<option value="${prEsc(o[0])}" ${v === o[0] ? 'selected' : ''}>${prEsc(o[1])}</option>`).join('')}</select>`;
  } else if (f.type === 'multi') {
    h += f.options.map(o => `<label class="check-item" style="margin-top:6px"><input type="checkbox" ${prArr(v).includes(o[0]) ? 'checked' : ''}
      onchange="prToggle('${w.id}','${f.id}','${prEsc(o[0])}',this.checked)"><span style="font-size:12.5px;flex:1">${o[1]}</span></label>`).join('');
  } else if (f.type === 'textarea') {
    h += `<textarea rows="${f.rows || 3}" style="${st}" placeholder="${prEsc(f.ph || '')}" onchange="${on}">${prEsc(v || '')}</textarea>`;
  } else {
    h += `<input style="${st}" value="${prEsc(v || '')}" placeholder="${prEsc(f.ph || (f.type === 'date' ? 'дд.мм.гггг' : ''))}"
      ${f.type === 'number' ? 'inputmode="decimal"' : ''} onchange="${on}">`;
  }
  return h;
}

function prReport() {
  const works = PR_WORKS.map(w => {
    const r = PR.results[w.id];
    return { id: w.id, title: w.title, lessons: w.lessons.map(l => '«' + PR_COURSES[l[0]] + '» ' + l[1]),
      status: r ? (r.pass ? 'зачёт' : 'не зачтено') : 'не выполнялась', score: r ? r.score : null, max: r ? r.max : null,
      pct: r ? r.pct : null, checked_at: r ? r.at : null, failed: r ? r.items.filter(i => !i.ok).map(i => i.text) : [],
      answers: PR.answers[w.id] || {} };
  });
  return { title: 'Практикум «Цифровой технадзор» — учебная версия (ДЕМО)', student: PR.fio || '(не указано)', group: PR.group || '',
    created: new Date().toLocaleString('ru-RU'), passed: works.filter(x => x.status === 'зачёт').length, total: works.length, works,
    note: 'Объект «ДЕМО» учебный. Отчёт сформирован в браузере курсанта и содержит только введённые им данные.' };
}
function prReportText(R) {
  const L = [R.title, 'Курсант: ' + R.student + (R.group ? ' · группа: ' + R.group : ''), 'Сформирован: ' + R.created,
    'Зачтено работ: ' + R.passed + ' из ' + R.total, ''];
  R.works.forEach(w => {
    L.push(w.id + '. ' + w.title + ' — ' + w.status + (w.score !== null ? ' (' + w.score + '/' + w.max + ', ' + w.pct + ' %)' : ''));
    L.push('   уроки: ' + w.lessons.join('; '));
    w.failed.forEach(f => L.push('   не выполнено: ' + f));
  });
  L.push('', R.note);
  return L.join('\n');
}
function prDownload(name, text, type) {
  const u = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = u; a.download = name;
  if (document.body && document.body.appendChild) document.body.appendChild(a);
  if (a.click) a.click();
  setTimeout(() => URL.revokeObjectURL(u), 2000);
}
function prExport(kind) {
  const R = prReport(), d = new Date().toISOString().slice(0, 10);
  if (kind === 'json') prDownload('praktikum_DEMO_' + d + '.json', JSON.stringify(R, null, 1), 'application/json');
  else prDownload('praktikum_DEMO_' + d + '.txt', prReportText(R), 'text/plain;charset=utf-8');
}

    const ar = R['ТК-Арм'].r; o.arm_days = String(Math.ceil(ar.need / (ar.list.reduce((s, l) => s + num(l.n), 0) * ar.hrs)));
    return o;
  },
  bad: () => {
    const R = pr09Res();
    return { 'ТК-Зем_need': String(R['ТК-Зем'].r.need), 'ТК-Зем_ok': R['ТК-Зем'].r.ok ? 'ok' : 'short', 'ТК-Арм_need': String(R['ТК-Арм'].r.need),

});

      prC('extra', 'Лишние документы не включены', !extra.some(x => prArr(a.docs).includes(x)), 2, 'КП, фото без привязки, неподписанные черновики и Р-1 — не исполнительная документация.'),
      prC('aosr_n', 'АОСР: ' + TK_STEPS.length, prN(a.aosr_n) === TK_STEPS.length, 1, 'По одному акту на каждую ТК нулевого цикла.'),

// ПР-11. Отчёт в ГАСК до 5-го (функции приложения gaskNum/gaskDue)

  aosr: [['№ 2', '28.10.2026'], ['№ 3', '31.10.2026'], ['№ 4', '05.11.2026'], ['№ 5', '07.11.2026'], ['№ 6', '19.11.2026'], ['№ 7', '02.12.2026']] };

// ПР-12. Плотность обратной засыпки (функция приложения bfStats, табл. А.1 п. 7 СП РК 5.01-101-2013)
const PR12 = { design: '1.65', rho: [1.68, 1.66, 1.70, 1.58, 1.67, 1.62, 1.69, 1.71, 1.57, 1.66] };
function pr12Stats() {
  const keep = STATE.backfill;
  STATE.backfill = { design: PR12.design, tests: PR12.rho.map(r => ({ rho: String(r) })) };
  try { return bfStats(); } finally { STATE.backfill = keep; }
}
const pr12Low = () => PR12.rho.map((x, i) => x < num(PR12.design) - 0.06 - 1e-9 ? String(i + 1) : null).filter(Boolean);
PR_WORKS.push({
  id: 'ПР-12', title: 'Принять плотность обратной засыпки', pass: 80,
  lessons: [prL('ПТО', '6.1'), prL('ПТО', '7.1'), prL('ТН', '3.2')],
  goal: 'По протоколу определений плотности сухого грунта решить, принимается ли засыпка.',
  norms: 'СП РК 5.01-101-2013, табл. А.1, п. 7: средняя плотность сухого грунта не ниже проектной; отдельные значения ниже проектной не более чем на 0,06 г/см³ и не более чем в 20 % определений.',
  given: () => prDoc('Протокол контроля плотности (ДЕМО)', 'проектная плотность сухого грунта ' + PR12.design + ' г/см³') +
    prTable(PR12.rho.map((x, i) => '№' + (i + 1)), [PR12.rho.map(x => x.toFixed(2))]),
  steps: ['Вычислите среднюю (3 знака).', 'Посчитайте определения ниже проектной.', 'Найдите определения ниже проектной более чем на 0,06.', 'Примите решение.'],
  fields: [
    { id: 'avg', type: 'number', label: '1. Средняя плотность, г/см³' }, { id: 'below', type: 'number', label: '2. Определений ниже проектной' },
    { id: 'low', type: 'multi', label: '3. Ниже проектной более чем на 0,06', options: PR12.rho.map((x, i) => [String(i + 1), '№' + (i + 1) + ' — ' + x.toFixed(2)]) },
    { id: 'verdict', type: 'select', label: '4. Решение', options: [['accept', 'Принять засыпку'], ['reject', 'Не принимать: доуплотнить участки, повторные определения']] }],
  check: a => {
    const s = pr12Stats(), v = prN(a.avg);
    return [
      prC('avg', 'Средняя ' + s.avg, v !== null && Math.abs(v - s.avg) <= 0.001, 1, 'Сумма / 10.'),
      prC('below', 'Ниже проектной: ' + s.below, prN(a.below) === s.below, 1, 'Считайте все значения меньше ' + PR12.design + '.'),
      prC('low', 'Найдены значения ниже проектной более чем на 0,06', prSame(a.low, pr12Low()), 2, 'Порог ' + (num(PR12.design) - 0.06).toFixed(2) + ' г/см³.', true),
      prC('verdict', 'Решение соответствует табл. А.1 п. 7', a.verdict === (s.ok ? 'accept' : 'reject'), 2, 'Нарушено два условия: есть значения ниже на 0,07–0,08 и их доля 30 % > 20 %.', true)];
  },
  hints: ['Средняя может быть выше проектной, а засыпка всё равно не принимается — проверяются все три условия.'],
  ref: () => { const s = pr12Stats(); return { avg: String(s.avg), below: String(s.below), low: pr12Low(), verdict: s.ok ? 'accept' : 'reject' }; },
  bad: () => { const s = pr12Stats(); return { avg: String(s.avg), below: String(s.below), low: pr12Low(), verdict: 'accept' }; },
  badFail: ['verdict']
});
